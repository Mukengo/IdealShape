    <div class="body"><p>${x.d}</p></div></details>`).join('')}

  <h2 style="margin:26px 0 11px">Biblioteca de exercícios</h2>
  <p class="small muted" style="margin:0 0 11px">${EXERCICIOS.length} exercícios com alvo, erro comum e substituições. A busca completa fica na aba Treino.</p>
  ${GRUPOS.map(g=>{const l=EXERCICIOS.filter(e=>e.g===g); if(!l.length) return '';
    return `<details><summary><strong style="font-size:14.5px;color:${corGrupo(g)}">${g}</strong><span class="pill n">${l.length}</span></summary>
    <div class="body">${l.map(e=>{const pr=prescricao(e); return `<p><strong style="color:var(--ink)">${e.n}</strong>
      <span class="muted">· ${e.eq} · ${e.p} · ${pr.faixa} reps</span><br>${e.erro}<br>
      <span class="muted">Troca por: ${e.sub.join(', ')}.</span></p>`;}).join('')}</div></details>`;}).join('')}`;
}

/* ---- VOCÊ -------------------------------------------------------------- */
function telaVoce(){
  const p=S.perfil, m=metasDoDia(), imc=F.imc(p.peso,p.altura);
  const h=S.pesos.slice(-14), min=Math.min(...h.map(x=>x.peso)), max=Math.max(...h.map(x=>x.peso)), sp=(max-min)||1;
  view.innerHTML=`
  <h1>Você</h1>
  <p class="small muted" style="margin:5px 0 17px">Perfil, evolução e seus dados.</p>
  <div class="card">
    <span class="tiny">Metabolismo</span>
    <div class="row" style="gap:20px;margin-top:11px">
      <div><div class="bignum">${m.tmb}</div><div class="tiny">TMB</div></div>
      <div><div class="bignum">${m.tdee}</div><div class="tiny">TDEE</div></div>
      <div><div class="bignum" style="color:var(--green-d)">${m.kcal}</div><div class="tiny">Meta</div></div></div>
    ${(()=>{const g=guardaNutricional(); return g.trava?`<div class="note a small" style="margin-top:13px">${g.txt}</div>`:'';})()}
    <p class="small muted" style="margin:13px 0 0">TMB é o gasto em repouso absoluto, pela equação de Mifflin-St Jeor. O TDEE soma o gasto do dia inteiro usando o fator ${F.fator(p.dias)}, referente a ${p.dias} dias de treino. A meta aplica ${m.delta<0?`déficit de ${Math.abs(m.delta)} kcal, ou ${Math.abs(m.delta/m.tdee*100).toFixed(0)}% do seu gasto`:m.delta>0?`superávit de ${m.delta} kcal`:'manutenção'}${m.extra?`, mais ${m.extra} kcal pela demanda ${p.gestacao==='amamentando'?'da amamentação':'gestacional'}`:''}. O corte é proporcional ao gasto, e não um valor fixo: 400 kcal representam pouco para quem gasta 3000 e muito para quem gasta 1500. É estimativa: ajuste depois de 2 a 3 semanas observando o peso real.</p>
  </div>
  <div class="card">
    <div class="between"><span class="tiny">Peso</span><span class="mono small">IMC ${imc.toFixed(1)}</span></div>
    ${(()=>{const md=mediaPeso(), r=ritmoPeso(); if(md==null) return '';
      return `<div class="row" style="gap:18px;margin-top:10px">
        <div><div class="bignum">${md.toFixed(1)}</div><div class="tiny">média 7 dias</div></div>
        ${r?`<div><div class="bignum" style="color:${r.rapido?'var(--alert)':'var(--green-d)'}">${r.pctSem>0?'+':''}${r.pctSem.toFixed(2)}%</div><div class="tiny">por semana</div></div>`:''}
      </div>
      <p class="small muted" style="margin:9px 0 0">O peso do dia oscila 1 a 2 kg por água, sal, carboidrato, creatina e ciclo menstrual. Por isso a tendência aqui usa média de 7 dias, e não a última pesagem.</p>`;})()}
    ${h.length>1?`<div style="display:flex;align-items:flex-end;gap:4px;height:72px;margin:15px 0 6px">
      ${h.map(x=>`<div style="flex:1;background:var(--grad);border-radius:3px 3px 0 0;height:${18+((x.peso-min)/sp)*54}px"></div>`).join('')}</div>
      <div class="between tiny"><span>${fmtData(h[0].data)} · ${h[0].peso}kg</span><span>${fmtData(h[h.length-1].data)} · ${h[h.length-1].peso}kg</span></div>`:''}
    <div class="row" style="margin-top:13px"><input type="number" step="0.1" inputmode="decimal" id="novopeso" placeholder="peso de hoje (kg)">
      <button class="btn small primary" id="addpeso">Registrar</button></div>
  </div>
  <div class="card stack">
    <span class="tiny">Objetivo e divisão</span>
    <div class="chips" id="objv">${[['cutting','Perder gordura'],['bulking','Ganhar massa'],['manutencao','Manter']]
      .map(([k,n])=>`<button class="chip" data-obj="${k}" aria-pressed="${p.objetivo===k}">${n}</button>`).join('')}</div>
    <select id="divv">${Object.entries(DIVISOES).map(([k,v])=>`<option value="${k}" ${p.divisao===k?'selected':''}>${v.nome} · ${v.dias} dias</option>`).join('')}</select>
    <div class="field"><label for="diasv">Dias de treino por semana</label><input id="diasv" type="number" inputmode="numeric" value="${p.dias}"></div>
  </div>
  <div class="card stack">
    <span class="tiny">Equipamento disponível</span>
    <div class="chips" id="eqv">
      ${EQUIPAMENTOS.map(x=>`<button class="chip" data-eqv="${x.k}" aria-pressed="${(p.equip||[]).includes(x.k)}">${x.n}</button>`).join('')}</div>
    <p class="small muted" style="margin:0">${EXERCICIOS.filter(e=>[...(p.equip||[]),...EQ_LIVRE].includes(e.eq)).length} dos ${EXERCICIOS.length} exercícios disponíveis. Peso corporal está sempre incluído.</p>
  </div>
  <div class="card stack">
    <span class="tiny">Saúde</span>
    ${p.sexo==='F'?`<div class="chips" id="gzv">
      ${GESTACAO.map(x=>`<button class="chip" data-gzv="${x.k}" aria-pressed="${(p.gestacao||'nao')===x.k}">${x.n}</button>`).join('')}</div>`:''}
    <div class="tiny" style="font-size:9.5px">Condições clínicas</div>
    <div class="chips" id="cdv">
      ${CONDICOES.filter(c=>c.tipo==='clinica').map(c=>`<button class="chip" data-cdv="${c.k}" aria-pressed="${(p.condicoes||[]).includes(c.k)}">${c.n}</button>`).join('')}</div>
    <div class="tiny" style="font-size:9.5px;margin-top:4px">Lesões</div>
    <div class="chips" id="cdv2">
      ${CONDICOES.filter(c=>c.tipo==='lesao').map(c=>`<button class="chip" data-cdv="${c.k}" aria-pressed="${(p.condicoes||[]).includes(c.k)}">${c.n}</button>`).join('')}</div>
    <p class="small muted" style="margin:0">Mantenha atualizado: é o que decide se o app prescreve déficit e quais exercícios recebem alerta. Lesão que já passou pode ser desmarcada.</p>
  </div>
  <div class="card stack">
    <span class="tiny">Restrições alimentares</span>
    <div class="chips" id="rsv">
      ${RESTRICOES.map(r=>`<button class="chip g" data-rsv="${r.k}" aria-pressed="${(p.restricoes||[]).includes(r.k)}">${r.n}</button>`).join('')}</div>
    <p class="small muted" style="margin:0">${ALIMENTOS.filter(a=>(p.restricoes||[]).every(k=>a.tags[k])).length} dos ${ALIMENTOS.length} alimentos disponíveis.${p.alergia&&!/nenhum/i.test(p.alergia)?` Alergias anotadas: ${esc(p.alergia)} — o Coach considera, mas o filtro automático não cobre isso, então confira o rótulo.`:''}</p>
  </div>
  <div class="card stack">
    <span class="tiny">Chave de IA própria</span>
    <p class="small muted" style="margin:0">Opcional. Sem ela o Coach usa a chave compartilhada do app, que tem cota diária. Com a sua, você conversa sem limite compartilhado e de graça — os provedores abaixo não cobram cartão.</p>
    <div class="chips" id="provIA">
      ${PROVEDORES_IA.map(p=>`<button class="chip" data-prov="${p.k}" aria-pressed="${chaveIA().provedor===p.k}">${p.n}</button>`).join('')}</div>
    ${(()=>{const p=PROVEDORES_IA.find(x=>x.k===chaveIA().provedor);
      return `<p class="small muted" style="margin:0">${p.n}: ${p.lim}. Pegue a chave em <strong>${p.url}</strong>. Privacidade: ${p.dados}.</p>`;})()}
    <div class="field"><label for="kia">Sua chave</label>
      <input id="kia" type="password" value="${esc(chaveIA().chave)}" placeholder="cole aqui, ou deixe vazio para usar a do app" autocomplete="off"></div>
    <div class="row"><button class="btn small primary" id="salvarK">Salvar</button>
      <button class="btn small ghost" id="limparK">Remover</button>
      <span class="small muted" id="msgK">${chaveIA().chave?'Chave salva neste aparelho.':''}</span></div>
    ${chaveIA().provedor==='gemini'&&chaveIA().chave?`<div class="note w small">O plano gratuito do Gemini pode usar o que você envia para treinar modelos. O Coach recebe seu peso, condições de saúde e lesões. Se isso te incomoda, prefira Groq ou Anthropic.</div>`:''}
  </div>
  <div class="card stack">
    <span class="tiny">Aparência</span>
    <div class="chips" id="tema">
      ${TEMAS.map(t=>`<button class="chip" data-tema="${t.k}" aria-pressed="${temaSalvo()===t.k}">${t.n}</button>`).join('')}</div>
    <p class="small muted" style="margin:0">No escuro o azul e o verde da marca são clareados para continuarem legíveis. "Do sistema" acompanha o modo escuro do aparelho.</p>
  </div>
  <div class="card stack">
    <span class="tiny">Seus dados</span>
    <p class="small muted" style="margin:0">Peso, medidas, condições de saúde e fotos são dados sensíveis pela LGPD. Hoje tudo fica salvo apenas neste aparelho, e só o que você escreve no Coach sai daqui. Você pode exportar ou apagar tudo a qualquer momento, e apagar é definitivo.</p>
    <button class="btn ghost" id="export">Exportar tudo (JSON)</button>
    <button class="btn ghost" id="wipe" style="color:var(--alert);border-color:var(--alert)">Apagar todos os meus dados</button>
  </div>
  <div class="note a small">O IdealShape organiza, motiva e otimiza — não substitui médico, nutricionista, fisioterapeuta ou psicólogo. Diante de dor que persiste, piora ou irradia, lesão, ou qualquer condição de saúde, procure um profissional antes de treinar por cima. Apoio emocional: CVV, 188, ligação gratuita 24 horas.</div>`;
  view.querySelector('#addpeso').onclick=()=>{const v=+view.querySelector('#novopeso').value; if(!v)return;
    S.pesos.push({data:hoje(),peso:v}); S.perfil.peso=v; save(); telaVoce();};
  view.querySelector('#provIA').onclick=e=>{const b=e.target.closest('.chip'); if(!b)return;
    salvarChaveIA(view.querySelector('#kia').value.trim(),b.dataset.prov); telaVoce();};
  view.querySelector('#salvarK').onclick=()=>{
    const v=view.querySelector('#kia').value.trim();
    salvarChaveIA(v,chaveIA().provedor);
    view.querySelector('#msgK').textContent = v?'Chave salva neste aparelho.':'Nenhuma chave salva.';
  };
  view.querySelector('#limparK').onclick=()=>{ salvarChaveIA('',chaveIA().provedor); telaVoce(); };
  view.querySelector('#tema').onclick=e=>{const b=e.target.closest('.chip'); if(!b)return; aplicarTema(b.dataset.tema); telaVoce();};
  const gzv=view.querySelector('#gzv');
  if(gzv) gzv.onclick=e=>{const b=e.target.closest('.chip'); if(!b)return; S.perfil.gestacao=b.dataset.gzv; save(); render();};
  const togCond=e=>{const b=e.target.closest('.chip'); if(!b)return;
    const k=b.dataset.cdv, at=S.perfil.condicoes||[];
    S.perfil.condicoes = at.includes(k)?at.filter(x=>x!==k):[...at,k]; save(); telaVoce();};
  view.querySelector('#cdv').onclick=togCond;
  view.querySelector('#cdv2').onclick=togCond;
  view.querySelector('#eqv').onclick=e=>{const b=e.target.closest('.chip'); if(!b)return;
    const k=b.dataset.eqv, at=S.perfil.equip||[];
    S.perfil.equip = at.includes(k)?at.filter(x=>x!==k):[...at,k]; save(); telaVoce();};
  view.querySelector('#rsv').onclick=e=>{const b=e.target.closest('.chip'); if(!b)return;
    const k=b.dataset.rsv, at=S.perfil.restricoes||[];
    S.perfil.restricoes = at.includes(k)?at.filter(x=>x!==k):[...at,k]; save(); telaVoce();};
  view.querySelector('#objv').onclick=e=>{const b=e.target.closest('.chip'); if(!b)return; S.perfil.objetivo=b.dataset.obj; save(); render();};
  view.querySelector('#divv').onchange=e=>{S.perfil.divisao=e.target.value; if(S.serie&&e.target.value!==S.serie.divisao){S.serie=null; S.perfil.semSerie=true;} rascunho=null; save(); render();};
  view.querySelector('#diasv').onchange=e=>{S.perfil.dias=+e.target.value||1; save(); telaVoce();};
  view.querySelector('#export').onclick=()=>{const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
    a.download='idealshape-'+hoje()+'.json'; a.click();};
  view.querySelector('#wipe').onclick=async()=>{
    if(!confirm('Isso apaga perfil, treinos, refeições e histórico de peso. Não dá para desfazer.')) return;
    await store.clear(); S=vazio(); render();};
}

/* ---------- EVENTOS ----------------------------------------------------- */
nav.onclick=e=>{const b=e.target.closest('.tab'); if(!b)return; S.tab=b.dataset.tab; save(); render();};
view.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){S.tab=go.dataset.go;save();render();return;}
  const car=e.target.closest('[data-carregar]');
  if(car){ carregarSerieNoTreino(); telaTreino.q=''; S.tab='treino'; save(); render(); return; }
  const tro=e.target.closest('[data-trocar]');
  if(tro){ const [si,ei]=tro.dataset.trocar.split('|').map(Number); trocarExercicioSerie(si,ei);
    const y=window.scrollY; telaPlano(); window.scrollTo(0,y); return; }
  const reg=e.target.closest('[data-regerar]');
  if(reg){ S.serie=null; S.perfil.semSerie=false; garantirSerie(); rascunho=null; render(); return; }
  const add=e.target.closest('[data-add]'); if(add){rascunho.exercicios.push({nome:add.dataset.add,series:[]});telaTreino.q='';telaTreino();return;}
  const del=e.target.closest('[data-del]'); if(del){rascunho.exercicios.splice(+del.dataset.del,1);telaTreino();return;}
  const usar=e.target.closest('[data-usar]'); if(usar){S.perfil.divisao=usar.dataset.usar;rascunho=null;save();render();return;}
  const ser=e.target.closest('[data-serie]');
  if(ser){ const i=+ser.dataset.serie, g=f=>view.querySelector(`[data-f="${f}"][data-i="${i}"]`);
    const reps=+g('reps').value, carga=+g('carga').value, rir=g('rir').value===''?2:+g('rir').value;
    if(!reps||!carga){g('reps').focus();return;}
    rascunho.exercicios[i].series.push({reps,carga,rir}); telaTreino(); return; }
  if(e.target.id==='salvarTreino'){
    rascunho.exercicios=rascunho.exercicios.filter(x=>x.series.length);
    if(!rascunho.exercicios.length){rascunho=null;telaTreino();return;}
    S.treinos.push(rascunho); rascunho=null; S.tab='hoje'; save(); render(); return; }
  const fc=e.target.closest('[data-cat]');
  if(fc){ telaComida.cat=fc.dataset.cat; telaComida(); return; }
  const med=e.target.closest('[data-med]');
  if(med){ registrarAlimento(med.dataset.med,+med.dataset.g,med.textContent.replace(/ · .*/,'')); return; }
  const rm=e.target.closest('[data-rm]');
  if(rm){ const idx=+rm.dataset.rm, r=S.refeicoes.find(x=>x.data===hoje());
    if(r){ r.itens.splice(idx,1); save(); telaComida(); } return; }
  const eat=e.target.closest('[data-eat]');
  if(eat){ const nome=eat.dataset.eat;
    const gram=+view.querySelector(`[data-gram="${CSS.escape(nome)}"]`).value; if(!gram)return;
    registrarAlimento(nome,gram); return; }
});

function registrarAlimento(nome,gram,rotulo){
  const a=ALIMENTOS.find(x=>x.n===nome); if(!a||!gram) return;
  const f=gram/100;
  let r=S.refeicoes.find(x=>x.data===hoje());
  if(!r){ r={data:hoje(),itens:[]}; S.refeicoes.push(r); }
  r.itens.push({nome,gram,rotulo:rotulo?rotulo+' ('+gram+' g)':null,k:a.k*f,p:a.p*f,c:a.c*f,g:a.g*f});
  telaComida.q=''; save(); telaComida();
}

/* ---------- BOOT -------------------------------------------------------- */
(async()=>{
  S=(await store.get())||vazio();
  render();
})();

</script>
</body>
</html>
